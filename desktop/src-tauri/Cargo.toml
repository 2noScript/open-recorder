[package]
name = "open-recorder-desktop"
version = "0.1.1"
description = "Open Recorder Desktop Application"
authors = ["Open Recorder"]
edition = "2021"

[lib]
name = "open_recorder_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "OpenRecorder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
diesel = { version = "2", default-features = false, features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
thiserror = "2"
cpal = "0.15"
rdev = "0.5"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.22"
